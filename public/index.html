<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Olive &amp; Ember — Menu</title>
    <meta name="description" content="The seasonal menu at Olive & Ember, Victoria Island, Lagos." />
    <meta name="theme-color" content="#faf6f0" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#menu">Skip to the menu</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#top">
          <span class="brand__mark" aria-hidden="true">O&amp;E</span>
          <span class="brand__name" data-restaurant-name>Olive &amp; Ember</span>
        </a>

        <div class="tools">
          <div class="search">
            <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <line x1="16.5" y1="16.5" x2="21" y2="21" />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search dishes…"
              aria-label="Search the menu"
              autocomplete="off"
            />
            <button class="search__clear" id="search-clear" type="button" aria-label="Clear search" hidden>
              Clear
            </button>
          </div>
          <div class="diet" id="diet-filters" role="group" aria-label="Filter by dietary need"></div>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <p class="hero__eyebrow" data-hours></p>
        <h1 class="hero__title" data-restaurant-name>Olive &amp; Ember</h1>
        <p class="hero__tagline" data-tagline></p>
        <p class="hero__meta">
          <span data-address></span>
          <span class="hero__dot" aria-hidden="true">·</span>
          <a data-phone href="tel:"></a>
        </p>
      </section>

      <section class="picks" id="picks" hidden aria-labelledby="picks-label">
        <h2 class="section-label" id="picks-label">Chef’s picks</h2>
        <div class="picks__grid" id="picks-grid"></div>
      </section>

      <nav class="catnav" id="catnav" aria-label="Menu categories"></nav>

      <div class="menu" id="menu"></div>

      <div class="empty" id="empty" hidden>
        <p class="empty__lead">Nothing on the menu matches that.</p>
        <p class="empty__hint">Try a different dish, or clear the filters.</p>
        <button class="btn" id="clear-filters" type="button">Clear filters</button>
      </div>

      <footer class="footer">
        <p data-service-note class="footer__note"></p>
        <p data-allergen-note class="footer__note"></p>
        <p class="footer__legal">
          Prices in <span data-currency-code>NGN</span>, inclusive of VAT. · <span data-kitchen-note></span>
        </p>
      </footer>
    </main>

    <dialog class="dish-dialog" id="dish-dialog" aria-labelledby="dish-name">
      <button class="dish-dialog__close" id="dish-close" type="button" aria-label="Close">×</button>
      <p class="dish-dialog__category" id="dish-category"></p>
      <h2 class="dish-dialog__name" id="dish-name"></h2>
      <p class="dish-dialog__price" id="dish-price"></p>
      <p class="dish-dialog__desc" id="dish-desc"></p>
      <ul class="dish-dialog__tags" id="dish-tags"></ul>
      <p class="dish-dialog__foot">Tell your server about any allergies when you order.</p>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
